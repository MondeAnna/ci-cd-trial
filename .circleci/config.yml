version: 2.1

jobs:
  java_setup:
    docker:
      - image: maven:3.9.9-eclipse-temurin-21-noble
    steps:
      - checkout
      - run:
          name: Run tests
          command: mvn test
  python-setup:
    docker:
      - image: python:3.9 
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python3 -m pip install --upgrade pip
            pip install pytest
      - run:
          name: Run tests
          command: python3 -m pytest -v

workflows:
  version: 2
  java_test:
    jobs:
      - test:
          filters:
            branches:
              only: /.*java.*/
  python_test:
    jobs:
      - test:
          filters:
            branches:
              only: /.*python.*/
